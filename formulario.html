  <form class="formulario" id="miFormulario" action="https://api.web3forms.com/submit" method="POST">
    <!-- Configuración Web3Forms -->
    <input type="hidden" name="access_key" value="48e3be0d-e7b0-41f0-9c9d-de6ebfc32387">
    <input type="hidden" name="subject" value="Nueva opinión sobre IA recibida">
    <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

    <!-- Campos del Formulario -->
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required>

    <label for="correo">Correo Electrónico:</label>
    <input type="email" id="correo" name="correo" required>

    <label for="mensaje">Su opinión sobre la IA hoy en día:</label>
    <textarea id="mensaje" name="mensaje" required></textarea>

    <button type="submit" id="btnEnviar">Enviar Opinión</button>
    
    <!-- Mensaje de estado al enviar -->
    <div id="resultado-envio"></div>
  </form>
</div>

<!-- JavaScript para envío dinámico (AJAX) sin recargar la página -->
<script>
  const form = document.getElementById('miFormulario');
  const resultado = document.getElementById('resultado-envio');
  const btnEnviar = document.getElementById('btnEnviar');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    btnEnviar.textContent = 'Enviando...';
    btnEnviar.disabled = true;
    resultado.style.display = 'block';
    resultado.style.color = '#06B6D4';
    resultado.textContent = 'Procesando envío...';

    const formData = new FormData(form);

    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      body: formData
    })
    .then(async (response) => {
      let json = await response.json();
      if (response.status == 200) {
        resultado.style.color = '#10B981'; // Verde de éxito
        resultado.textContent = '¡Gracias! Su opinión ha sido enviada con éxito.';
        form.reset();
      } else {
        resultado.style.color = '#EF4444'; // Rojo de error
        resultado.textContent = json.message || 'Ocurrió un error al enviar.';
      }
    })
    .catch(error => {
      resultado.style.color = '#EF4444';
      resultado.textContent = 'Error de conexión. Intente de nuevo.';
    })
    .then(() => {
      btnEnviar.textContent = 'Enviar Opinión';
      btnEnviar.disabled = false;
      setTimeout(() => {
        resultado.style.display = 'none';
      }, 5000);
    });
  });
</script>
